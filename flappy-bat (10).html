<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bat 🦇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0518;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }
  #wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
  }
  /* TV horizontal colgado en vertical: rotamos el juego para que se vea derecho */
  #wrap.rot90 {
    width: 100vh;
    height: 100vw;
    transform: rotate(90deg) translateY(-100%);
    transform-origin: top left;
  }
  #wrap.rot270 {
    width: 100vh;
    height: 100vw;
    transform: rotate(-90deg) translateX(-100%);
    transform-origin: top left;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // Ancho lógico fijo; la altura se calcula según la proporción de la pantalla
  // para que el juego llene el 100% sin deformarse ni dejar franjas (ideal TV vertical)
  const W = 480;
  let H = 720;
  // Resolución adaptativa: en lugar de un supermuestreo fijo, se calcula el
  // factor SS justo para los píxeles reales de la pantalla (nítido sin desperdicio)
  // y "quality" baja automáticamente si el equipo no da abasto.
  let SS = 2;
  let quality = 1; // 1 → 0.75 → 0.5 según rendimiento

  const wrap = document.getElementById('wrap');
  let flipRotation = true; // orientación inicial: murciélago hacia arriba (R la invierte)

  function fitScreen() {
    const iw = Math.max(1, window.innerWidth);
    const ih = Math.max(1, window.innerHeight);
    const landscape = iw > ih; // TV horizontal → rotamos el juego 90°
    wrap.className = landscape ? (flipRotation ? 'rot270' : 'rot90') : '';
    // Dimensiones efectivas tras la rotación (como si fuera un celular vertical)
    const effW = landscape ? ih : iw;
    const effH = landscape ? iw : ih;
    H = Math.round(Math.max(600, Math.min(1200, W * (effH / effW))));
    // SS justo para la pantalla: píxeles reales del ancho mostrado / ancho lógico
    const dpr = window.devicePixelRatio || 1;
    const cap = lowMode ? 1.25 : 2; // techo de nitidez (menor = más liviano)
    SS = Math.max(1, Math.min(cap, (effW * dpr / W) * quality));
    canvas.width = Math.round(W * SS);
    canvas.height = Math.round(H * SS);
    skyGrad = null; // regenerar degradado del cielo (depende de H)
    regenStars();
    // Fuera de partida, recolocar todo con la nueva altura
    if (typeof state !== 'undefined' && state !== 'playing' && typeof reset === 'function') {
      reset();
      state = 'start';
    }
  }
  window.addEventListener('resize', fitScreen);

  // Monitor de rendimiento: si el promedio de frame es lento, baja la calidad
  // y, si aun así va justo, activa el "modo ligero" (menos efectos).
  let perfLast = 0, perfAcc = 0, perfCnt = 0;
  let lowMode = false;   // modo ligero: recorta efectos costosos
  let slowStreak = 0;
  function perfTick(now) {
    if (perfLast) {
      const dt = now - perfLast;
      if (dt < 100) { perfAcc += dt; perfCnt++; } // ignorar pausas largas (pestaña oculta)
    }
    perfLast = now;
    if (perfCnt >= 90) { // evaluar cada ~1.5 s
      const avg = perfAcc / perfCnt;
      perfAcc = 0; perfCnt = 0;
      if (avg > 22) {                        // por debajo de ~45 fps
        slowStreak++;
        if (quality > 0.5) {
          quality -= 0.25;
          fitScreen();
        } else if (!lowMode && slowStreak >= 2) {
          lowMode = true;                    // último recurso: recortar efectos
          fitScreen();                       // rehace lienzo y estrellas
        }
      } else if (avg < 13) {                 // sobra rendimiento
        slowStreak = 0;
        if (lowMode) { lowMode = false; fitScreen(); }
        else if (quality < 1) { quality += 0.25; fitScreen(); }
      } else {
        slowStreak = 0;
      }
    }
  }

  // ---------- Estado ----------
  // Rampa de dificultad: los primeros obstáculos son más amables (calentamiento)
  // y a partir del cuarto se usa la configuración estilo Flappy Bird clásico.
  const EASY_COUNT = 3;        // cuántos obstáculos iniciales van en modo fácil

  // Fase fácil (obstáculos 1 a 3)
  const EASY = {
    GRAVITY: 0.2,              // caída aún más suave
    GAP: 250,                   // hueco amplio
    SPACING: 400                // mucho aire entre obstáculos
  };
  // Fase normal (a partir del cuarto obstáculo)
  const NORMAL = {
    GRAVITY: 0.25,
    GAP: 170,
    SPACING: 264
  };

  const FLAP = -4.8;           // salto corto y controlable
  const OBSTACLE_W = 80;
  const SPEED = 2;             // desplazamiento más lento

  // Valores según la cantidad de obstáculos ya superados
  function gravityNow() {
    return score < EASY_COUNT ? EASY.GRAVITY : NORMAL.GRAVITY;
  }
  // El hueco y la separación dependen del número de obstáculo generado
  function gapFor(index) { return index < EASY_COUNT ? EASY.GAP : NORMAL.GAP; }
  function spacingFor(index) { return index < EASY_COUNT ? EASY.SPACING : NORMAL.SPACING; }

  let state = 'start'; // start | playing | dead
  let bat, obstacles, score, best = 0, frame = 0, stars, deathFlash;
  let currentFact = '', factQueue = [], pulses = [];
  let items = [], popups = [], eaten = 0;
  let seeds = [], plants = [], fruitCount = 0;
  // Modo atracción (kiosco): vuelve solo al inicio y rota datos si nadie juega
  let idleFrames = 0;                 // frames sin interacción del público
  const IDLE_RESET = 60 * 25;         // 25 s en Game Over → volver al inicio
  let attractFact = '', attractNext = 0;
  let obstacleCount = 0; // cuántos obstáculos se han generado en la partida

  try { best = Number(localStorage.getItem('flappyBatBest')) || 0; } catch(e) {}

  // Sprite del murciélago

  let batReady = false;

  let nextBlink = 160, blinkUntil = 0;

  const BAT_FACTS = [

  function pickFact() {
    if (factQueue.length === 0) {
      factQueue = [...BAT_FACTS].sort(() => Math.random() - 0.5);
    }
    currentFact = factQueue.pop();
  }

  function reset() {
    bat = { x: 120, y: H / 2, vy: 0, angle: 0, wing: 0 };
    obstacles = [];
    items = [];
    popups = [];
    seeds = [];
    plants = [];
    fruitCount = 0;
    score = 0;
    eaten = 0;
    frame = 0;
    deathFlash = 0;
    obstacleCount = 0;
    nextBlink = 180 + Math.floor(Math.random() * 121); // primer parpadeo a los 3-5 s
    blinkUntil = 0;
    let x = W + 200;
    for (let i = 0; i < 3; i++) {
      obstacles.push(makeObstacle(x));
      x += spacingFor(i); // separación según la fase del obstáculo recién creado
    }
  }

  function makeObstacle(x) {
    const index = obstacleCount++;
    const gap = gapFor(index);
    const margin = 90;
    const gapY = margin + Math.random() * Math.max(40, H - margin * 2 - gap);
    // Alimento entre este obstáculo y el siguiente (los murciélagos comen
    // frutas e insectos, según los datos del juego)
    spawnItem(x + OBSTACLE_W + spacingFor(index) / 2, gapY + gap / 2);
    return { x, gapY, gap, passed: false };
  }

  // ---------- Alimento: frutas, insectos y flores ----------
  function spawnItem(x, yRef) {
    if (Math.random() < 0.25) return; // no siempre aparece
    const roll = Math.random();
    let kind, variant = null, value;
    if (roll < 0.35) {                       // fruta
      kind = 'fruit';
      variant = Math.random() < 0.5 ? 'banana' : 'berry';
      value = 2;
    } else if (roll < 0.7) {                 // insecto
      kind = 'insect';
      value = 1;
    } else {                                 // flor (polinización)
      kind = 'flower';
      value = 3;                             // polinizar vale más
    }
    const y = Math.max(70, Math.min(H - 80, yRef + (Math.random() - 0.5) * 90));
    items.push({
      x, y,
      baseY: y,
      kind, variant, value,
      taken: false,
      wob: Math.random() * Math.PI * 2 // desfase de su vaivén
    });
  }

  // Estrellas del fondo (se regeneran si cambia el tamaño de pantalla)
  function regenStars() {
    const n = lowMode ? 22 : 60; // menos estrellas si el equipo va justo
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.85,
      r: Math.random() * 1.4 + 0.4,
      tw: Math.random() * Math.PI * 2
    }));
  }
  regenStars();

  // ---------- Entrada ----------
  // Respaldo de pantalla completa: si no se abrió con --kiosk, el primer
  // toque/clic/tecla pide fullscreen (los navegadores solo lo permiten así).
  function goFullscreen() {
    idleFrames = 0; // hubo interacción del público
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req && !document.fullscreenElement) {
      try { req.call(el); } catch (e) {}
    }
  }

  // ---------- Sonido (sintetizado, sin archivos externos) ----------
  let audioCtx = null, masterGain = null, soundOn = true, ambience = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.32;
      masterGain.connect(audioCtx.destination);
      startAmbience();
    } catch (e) { audioCtx = null; }
  }

  // Tono simple con envolvente (evita chasquidos)
  function beep({ freq = 440, dur = 0.12, type = 'sine', vol = 0.5, slideTo = null, delay = 0 }) {
    if (!audioCtx || !soundOn) return;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  // Ambiente nocturno: soplo de viento muy suave y continuo
  function startAmbience() {
    if (!audioCtx || ambience) return;
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {            // ruido rosa aproximado
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.5;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 420;
    const g = audioCtx.createGain(); g.gain.value = 0.12;
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start();
    ambience = { src, gain: g };
  }

  // Efectos concretos
  const sfx = {
    flap()   { beep({ freq: 620, slideTo: 900, dur: 0.09, type: 'triangle', vol: 0.16 }); },
    ping()   { beep({ freq: 2100, slideTo: 2600, dur: 0.05, type: 'sine', vol: 0.1 }); },
    echo()   { beep({ freq: 1500, slideTo: 1100, dur: 0.09, type: 'sine', vol: 0.09 }); },
    fruit()  { beep({ freq: 700, dur: 0.09, type: 'square', vol: 0.13 });
               beep({ freq: 1050, dur: 0.1, type: 'square', vol: 0.11, delay: 0.07 }); },
    insect() { beep({ freq: 900, slideTo: 1300, dur: 0.07, type: 'square', vol: 0.11 }); },
    flower() { beep({ freq: 880, dur: 0.1, type: 'sine', vol: 0.14 });
               beep({ freq: 1320, dur: 0.12, type: 'sine', vol: 0.12, delay: 0.08 });
               beep({ freq: 1760, dur: 0.14, type: 'sine', vol: 0.1, delay: 0.16 }); },
    seed()   { beep({ freq: 500, slideTo: 300, dur: 0.14, type: 'triangle', vol: 0.12 }); },
    sprout() { beep({ freq: 400, slideTo: 800, dur: 0.22, type: 'sine', vol: 0.12 }); },
    die()    { beep({ freq: 400, slideTo: 90, dur: 0.5, type: 'sawtooth', vol: 0.2 }); }
  };

  // ---------- Tabla de récords ----------
  const SCORES_KEY = 'flappyBatScores';
  const MAX_SCORES = 8;
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let scoreTable = [];
  // Entrada de iniciales estilo arcade, manejable con UN SOLO BOTÓN:
  // la letra va cambiando sola y el jugador toca para fijarla.
  let entryLetters = ['A', 'A', 'A'], entrySlot = 0, entryTick = 0, entryIdx = 0;
  let lastRankIndex = -1; // fila recién ingresada, para resaltarla

  function loadScores() {
    try {
      const raw = localStorage.getItem(SCORES_KEY);
      scoreTable = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(scoreTable)) scoreTable = [];
    } catch (e) { scoreTable = []; }
  }

  function persistScores() {
    try { localStorage.setItem(SCORES_KEY, JSON.stringify(scoreTable)); } catch (e) {}
  }

  // ¿El puntaje entra en la tabla?
  function qualifies(s) {
    if (s <= 0) return false;
    if (scoreTable.length < MAX_SCORES) return true;
    return s > scoreTable[scoreTable.length - 1].score;
  }

  function commitScore(name, s) {
    scoreTable.push({ name, score: s });
    scoreTable.sort((a, b) => b.score - a.score);
    scoreTable = scoreTable.slice(0, MAX_SCORES);
    lastRankIndex = scoreTable.findIndex(r => r.name === name && r.score === s);
    persistScores();
  }

  function startEntry() {
    entryLetters = ['A', 'A', 'A'];
    entrySlot = 0; entryTick = 0; entryIdx = 0;
    state = 'entry';
  }

  // Fija la letra actual y avanza; al completar 3, guarda y muestra la tabla
  function lockLetter() {
    entryLetters[entrySlot] = LETTERS[entryIdx];
    sfx.insect();
    entrySlot++;
    if (entrySlot >= 3) {
      commitScore(entryLetters.join(''), score);
      state = 'scores';
      idleFrames = 0;
      sfx.flower();
    } else {
      entryIdx = 0; entryTick = 0;
    }
  }

  loadScores();

  function flap() {
    goFullscreen();
    if (state === 'entry') { lockLetter(); return; }
    if (state === 'scores') { reset(); state = 'start'; return; }
    if (state === 'start') {
      state = 'playing';
      nextBlink = frame + 420; // el ciclo de 7 s del vuelo empieza aquí
      blinkUntil = 0;
    }
    if (state === 'playing') {
      bat.vy = FLAP;
      bat.wing = 1;
      pulses.push({ x: bat.x, y: bat.y, r: 8, echo: false, bounced: false, done: false });
      if (pulses.length > (lowMode ? 4 : 10)) pulses.shift(); // tope de ondas activas
      sfx.flap(); sfx.ping();
    } else if (state === 'dead' && deathFlash <= 0) {
      // Si el puntaje entra en la tabla, pedir iniciales; si no, volver al inicio
      if (qualifies(score)) startEntry();
      else { reset(); state = 'start'; }
    }
  }
  window.addEventListener('keydown', e => {
    if (state === 'entry') {
      // Con teclado se puede escribir directo (más rápido que esperar el ciclo)
      if (/^Key[A-Z]$/.test(e.code)) {
        e.preventDefault();
        entryIdx = LETTERS.indexOf(e.code.slice(3));
        lockLetter();
        return;
      }
      if (e.code === 'Backspace' && entrySlot > 0) {
        e.preventDefault(); entrySlot--; entryIdx = 0; entryTick = 0; return;
      }
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); lockLetter(); return; }
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
    if (e.code === 'KeyR') { flipRotation = !flipRotation; fitScreen(); } // invertir giro
    if (e.code === 'KeyM') {                                             // silenciar
      soundOn = !soundOn;
      if (masterGain) masterGain.gain.value = soundOn ? 0.32 : 0;
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  // ---------- Lógica ----------
  function update() {
    frame++;

    // Modo atracción: si nadie juega, volver solo al inicio y rotar datos
    idleFrames++;
    if (state === 'dead' && deathFlash <= 0 && idleFrames > IDLE_RESET) {
      reset();
      state = 'start';
      idleFrames = 0;
    }
    // Entrada de iniciales: la letra cambia sola (se juega con un solo botón)
    if (state === 'entry') {
      entryTick++;
      if (entryTick >= 26) { // ~0.43 s por letra
        entryTick = 0;
        entryIdx = (entryIdx + 1) % LETTERS.length;
        sfx.ping();
      }
      // Si nadie confirma, guardar con lo que haya y seguir
      if (idleFrames > 60 * 45) {
        while (entrySlot < 3) { entryLetters[entrySlot] = LETTERS[entryIdx]; entrySlot++; }
        commitScore(entryLetters.join(''), score);
        state = 'scores';
        idleFrames = 0;
      }
    }
    // Tabla de récords: tras un rato vuelve sola al inicio
    if (state === 'scores' && idleFrames > 60 * 15) {
      reset();
      state = 'start';
      idleFrames = 0;
    }
    if (state === 'start' && frame >= attractNext) {
      // Dato distinto cada ~8 s en la pantalla de espera
      pickFact();
      attractFact = currentFact;
      attractNext = frame + 60 * 8;
    }

    // Parpadeo: en la pantalla de inicio cada 3-5 s; volando cada 7 s
    if (state === 'start' && frame >= nextBlink) {
      blinkUntil = frame + 8;
      nextBlink = frame + 180 + Math.floor(Math.random() * 121); // 180-300 frames = 3-5 s
    } else if (state === 'playing' && frame >= nextBlink) {
      blinkUntil = frame + 8; // ojos cerrados una fracción de segundo
      nextBlink = frame + 420;
    }

    // Ondas de ecolocalización: viajan hasta chocar y el eco regresa al murciélago
    const WAVE_SPEED = 5;
    for (const p of pulses) {
      if (p.echo) {
        // Eco: viaja de regreso hacia el murciélago (hacia la izquierda... 
        // pero el murciélago avanza, así que seguimos su x actual)
        p.x -= WAVE_SPEED;               // el frente del eco vuelve
        p.r = Math.max(0, p.origin - p.x); // radio = distancia desde el punto de impacto
        if (p.x <= bat.x) p.done = true;   // llegó al murciélago
      } else {
        p.r += WAVE_SPEED;
        p.frontX = p.x + p.r;            // borde delantero de la onda
        // ¿El frente alcanzó la cara frontal de alguna estalactita sólida?
        if (!p.bounced && state === 'playing') {
          for (const ob of obstacles) {
            const face = ob.x;
            const enHueco = p.y > ob.gapY && p.y < ob.gapY + ob.gap;
            if (!enHueco && p.frontX >= face && p.x < face) {
              p.bounced = true;
              p.done = true; // la onda emitida desaparece al chocar
              // Nace el eco desde el punto de impacto, de vuelta al murciélago
              pulses.push({
                x: face, y: p.y, r: 0, origin: face,
                echo: true, done: false
              });
              sfx.echo();
              break;
            }
          }
        }
        // Si sale de la pantalla sin chocar, se desvanece
        if (p.frontX > W + 20) p.done = true;
      }
      if (state === 'playing') p.x -= SPEED; // desplazamiento del mundo
    }
    pulses = pulses.filter(p => !p.done);

    if (state === 'playing') {
      bat.vy += gravityNow();
      bat.y += bat.vy;
      bat.angle = Math.max(-0.35, Math.min(1.1, bat.vy * 0.1));
      bat.wing = Math.max(0, bat.wing - 0.08);

      for (const ob of obstacles) {
        ob.x -= SPEED;
        if (!ob.passed && ob.x + OBSTACLE_W < bat.x) {
          ob.passed = true;
          score++;
          if (score > best) {
            best = score;
            try { localStorage.setItem('flappyBatBest', best); } catch(e) {}
          }
        }
      }
      if (obstacles[0].x < -OBSTACLE_W) {
        obstacles.shift();
        obstacles.push(makeObstacle(obstacles[obstacles.length - 1].x + spacingFor(obstacleCount - 1)));
      }

      // Alimento: se desplaza, flota suavemente y se recoge al tocarlo
      for (const it of items) {
        it.x -= SPEED;
        it.y = it.baseY + Math.sin(frame * 0.06 + it.wob) * 6; // vaivén
        if (!it.taken) {
          const dx = bat.x - it.x, dy = bat.y - it.y;
          if (dx * dx + dy * dy < 24 * 24) { // radio de captura generoso
            it.taken = true;
            score += it.value;
            eaten++;
            // Dispersión de semillas: cada 3 frutas, el murciélago suelta una
            if (it.kind === 'fruit') {
              fruitCount++;
              if (fruitCount % 3 === 0) {
                seeds.push({ x: bat.x - 6, y: bat.y + 8, vy: 0.5, spin: 0 });
                sfx.seed();
                popups.push({ x: bat.x, y: bat.y - 22, txt: '¡semilla!', life: 1.2, small: true });
              }
            }
            if (score > best) {
              best = score;
              try { localStorage.setItem('flappyBatBest', best); } catch(e) {}
            }
            if (it.kind === 'flower') {
              // Polinización: el murciélago se lleva el polen en el pelaje
              popups.push({ x: bat.x, y: bat.y - 22, txt: '¡polen!', life: 1.2, small: true, pollen: true });
            }
            popups.push({ x: it.x, y: it.y, txt: '+' + it.value, life: 1 });
            if (it.kind === 'fruit') sfx.fruit();
            else if (it.kind === 'insect') sfx.insect();
            else sfx.flower();
          }
        }
      }
      items = items.filter(it => !it.taken && it.x > -40);

      // Semillas cayendo: al tocar el suelo germinan
      for (const s of seeds) {
        s.vy += 0.28;          // gravedad de la semilla
        s.y += s.vy;
        s.x -= SPEED;          // se desplaza con el mundo
        s.spin += 0.15;
        if (s.y >= H - 44) {   // tocó el suelo
          s.done = true;
          plants.push({ x: s.x, grow: 0, seed: Math.random() * 100 });
          sfx.sprout();
          if (plants.length > (lowMode ? 5 : 14)) plants.shift(); // tope de plantas
        }
      }
      seeds = seeds.filter(s => !s.done && s.x > -20);

      // Plantas: crecen rápido y luego se quedan meciéndose
      for (const pl of plants) {
        pl.x -= SPEED;
        if (pl.grow < 1) pl.grow = Math.min(1, pl.grow + 0.045); // crecimiento veloz
      }
      plants = plants.filter(pl => pl.x > -30);

      // Textos flotantes de puntos
      for (const p of popups) { p.y -= 0.9; p.x -= SPEED; p.life -= 0.02; }
      popups = popups.filter(p => p.life > 0);


      // Colisiones (hitbox algo menor que el sprite para que sea justa)
      const r = 11;
      if (bat.y + r > H - 40 || bat.y - r < 0) die();
      for (const ob of obstacles) {
        if (bat.x + r > ob.x && bat.x - r < ob.x + OBSTACLE_W) {
          if (bat.y - r < ob.gapY || bat.y + r > ob.gapY + ob.gap) die();
        }
      }
    } else if (state === 'start') {
      bat.y = H / 2 + Math.sin(frame * 0.06) * 12;
      bat.wing = (Math.sin(frame * 0.25) + 1) / 2;
    } else if (state === 'dead') {
      deathFlash = Math.max(0, deathFlash - 1);
      if (bat.y < H - 56) {
        bat.vy += gravityNow();
        bat.y = Math.min(H - 56, bat.y + bat.vy);
        bat.angle = Math.min(1.5, bat.angle + 0.08);
      }
    }
  }

  function die() {
    sfx.die();
    state = 'dead';
    deathFlash = 25;
    pickFact();
  }

  // ---------- Dibujo ----------
  let skyGrad = null, stalGrad = null;

  function drawBackground() {
    // Cielo nocturno (degradado cacheado; se regenera solo al cambiar tamaño)
    if (!skyGrad) {
      skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#0d0821');
      skyGrad.addColorStop(0.6, '#1e1140');
      skyGrad.addColorStop(1, '#35205e');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Estrellas titilando (un solo trazado por grupo de brillo, más ligero)
    const tw1 = 0.4 + 0.6 * Math.abs(Math.sin(frame * 0.02));
    ctx.fillStyle = `rgba(255,255,235,${tw1.toFixed(2)})`;
    ctx.beginPath();
    for (const s of stars) {
      ctx.moveTo(s.x + s.r, s.y);
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    }
    ctx.fill();

    // Luna
    ctx.fillStyle = '#f5edc8';
    ctx.beginPath();
    ctx.arc(390, 100, 42, 0, Math.PI * 2);
    ctx.fill();
    if (!lowMode) { // cráteres solo en calidad normal
      ctx.fillStyle = 'rgba(13,8,33,0.25)';
      ctx.beginPath(); ctx.arc(378, 90, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(402, 112, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(392, 82, 4, 0, Math.PI * 2); ctx.fill();
    }

    // Colinas lejanas (parallax); menos vértices si el equipo va justo
    const step = lowMode ? 30 : 10;
    ctx.fillStyle = '#241448';
    ctx.beginPath();
    ctx.moveTo(0, H - 40);
    for (let x = 0; x <= W; x += step) {
      const y = H - 100 - Math.sin((x + frame * 0.3) * 0.012) * 35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H - 40);
    ctx.closePath();
    ctx.fill();
  }

  function drawObstacles() {
    for (const ob of obstacles) {
      drawStalactite(ob.x, 0, OBSTACLE_W, ob.gapY, true);
      drawStalactite(ob.x, ob.gapY + ob.gap, OBSTACLE_W, H - 40 - (ob.gapY + ob.gap), false);
    }
  }

  function drawStalactite(x, y, w, h, fromTop) {
    if (h <= 0) return;
    if (!stalGrad) {
      stalGrad = ctx.createLinearGradient(0, 0, w, 0);
      stalGrad.addColorStop(0, '#4a3572');
      stalGrad.addColorStop(0.5, '#5d4590');
      stalGrad.addColorStop(1, '#3a2960');
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = stalGrad;

    ctx.beginPath();
    if (fromTop) {
      ctx.moveTo(0, 0);
      ctx.lineTo(w, 0);
      ctx.lineTo(w, h - 30);
      ctx.lineTo(w * 0.72, h - 8);
      ctx.lineTo(w * 0.55, h);       // punta
      ctx.lineTo(w * 0.38, h - 12);
      ctx.lineTo(w * 0.18, h - 26);
      ctx.lineTo(0, h - 34);
    } else {
      ctx.moveTo(0, h);
      ctx.lineTo(w, h);
      ctx.lineTo(w, 30);
      ctx.lineTo(w * 0.72, 8);
      ctx.lineTo(w * 0.55, 0);       // punta
      ctx.lineTo(w * 0.38, 12);
      ctx.lineTo(w * 0.18, 26);
      ctx.lineTo(0, 34);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#2a1a4d';
    ctx.fillRect(0, H - 40, W, 40);
    if (!lowMode) { // franjas decorativas solo en calidad normal
      ctx.fillStyle = '#3d2870';
      for (let x = -((frame * SPEED) % 30); x < W; x += 30) {
        ctx.fillRect(x, H - 40, 15, 5);
      }
    }
  }

  // ---------- Alimento ----------
  function drawItems() {
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.kind === 'fruit' && it.variant === 'banana') {
        // Racimo de bananos: cada uno es un arco con grosor afilado en las puntas
        ctx.rotate(-0.12);
        ctx.lineWidth = 1.1;
        ctx.lineJoin = 'round';
        const bunch = [
          { dx: -2.5, dy: -4.5, rot: -0.22, col: '#e3ba38' },
          { dx: 0,    dy: 0,    rot: 0,     col: '#f7d654' },
          { dx: 2.5,  dy: 4.5,  rot: 0.22,  col: '#e8c246' }
        ];
        for (const b of bunch) {
          const R = 12, thick = 7;
          const a0 = 0.52 + b.rot, a1 = 2.62 + b.rot; // arco inferior (media luna)
          ctx.beginPath();
          const steps = 12;
          // borde exterior
          for (let i = 0; i <= steps; i++) {
            const t = i / steps, a = a0 + (a1 - a0) * t;
            const th = thick * Math.pow(Math.sin(Math.PI * t), 0.65) / 2;
            const rr = R + th;
            const px = b.dx + rr * Math.cos(a), py = b.dy - 8 + rr * Math.sin(a);
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          }
          // borde interior (de vuelta)
          for (let i = steps; i >= 0; i--) {
            const t = i / steps, a = a0 + (a1 - a0) * t;
            const th = thick * Math.pow(Math.sin(Math.PI * t), 0.65) / 2;
            const rr = R - th;
            ctx.lineTo(b.dx + rr * Math.cos(a), b.dy - 8 + rr * Math.sin(a));
          }
          ctx.closePath();
          ctx.fillStyle = b.col;
          ctx.fill();
          ctx.strokeStyle = '#96731a';
          ctx.stroke();
        }
        // tallo que une el racimo
        ctx.strokeStyle = '#6b4a12';
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-10.5, -3.5);
        ctx.lineTo(-13, -8);
        ctx.stroke();
      } else if (it.kind === 'fruit') {
        // Fruta tipo higo/mango (alimento de murciélagos frugívoros)
        ctx.fillStyle = '#e0568a';
        ctx.beginPath();
        ctx.ellipse(0, 1, 9, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // brillo
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.ellipse(-3, -3, 3, 4, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // tallo y hoja
        ctx.strokeStyle = '#6b4a2a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -9); ctx.lineTo(1, -14);
        ctx.stroke();
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.ellipse(5, -13, 5, 3, -0.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.kind === 'flower') {
        // Flor nocturna (los murciélagos la polinizan al beber néctar)
        const pulse = 1 + Math.sin(frame * 0.08 + it.wob) * 0.06;
        ctx.scale(pulse, pulse);
        // pétalos
        ctx.fillStyle = '#e8d9ff';
        ctx.strokeStyle = '#b79ae0';
        ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + frame * 0.004;
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * 7, Math.sin(a) * 7, 5, 3.4, a, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        // centro con polen brillante
        const glow = 0.5 + 0.5 * Math.abs(Math.sin(frame * 0.09 + it.wob));
        ctx.fillStyle = `rgba(255,214,90,${0.75 + glow * 0.25})`;
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();
        // motitas de polen flotando (se omiten en modo ligero)
        if (!lowMode) {
          ctx.fillStyle = `rgba(255,235,150,${glow * 0.8})`;
          for (let i = 0; i < 4; i++) {
            const a = (i / 4) * Math.PI * 2 + frame * 0.05 + it.wob;
            const rr = 9 + Math.sin(frame * 0.07 + i) * 2;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else {
        // Insecto tipo polilla (alimento de murciélagos insectívoros)
        const flutter = Math.sin(frame * 0.4 + it.wob) * 0.5;
        ctx.fillStyle = 'rgba(230,225,190,0.9)';
        ctx.strokeStyle = '#8a7f5a';
        ctx.lineWidth = 1;
        for (const side of [-1, 1]) {
          ctx.save();
          ctx.scale(side, 1);
          ctx.rotate(flutter * 0.6);
          ctx.beginPath();
          ctx.ellipse(6, -2, 7, 4, -0.4, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.restore();
        }
        // cuerpo
        ctx.fillStyle = '#5e4a34';
        ctx.beginPath();
        ctx.ellipse(0, 1, 2.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // antenas
        ctx.strokeStyle = '#5e4a34';
        ctx.beginPath();
        ctx.moveTo(-1, -5); ctx.lineTo(-4, -9);
        ctx.moveTo(1, -5); ctx.lineTo(4, -9);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ---------- Semillas y plantas (dispersión de semillas) ----------
  function drawSeeds() {
    for (const s of seeds) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#c9a227';
      ctx.beginPath();
      ctx.ellipse(0, 0, 3, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a6d14';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPlants() {
    for (const pl of plants) {
      const g = pl.grow;           // 0 → 1
      const h = 4 + g * 30;        // altura del tallo
      const baseY = H - 40;
      ctx.save();
      ctx.translate(pl.x, baseY);
      const sway = Math.sin(frame * 0.05 + pl.seed) * 0.08 * g;
      ctx.rotate(sway);

      // Tallo
      ctx.strokeStyle = '#4f9e46';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(2, -h * 0.6, 0, -h);
      ctx.stroke();

      // Hojas (aparecen conforme crece)
      if (g > 0.25) {
        const ls = Math.min(1, (g - 0.25) / 0.5);
        ctx.fillStyle = '#5cb85c';
        for (const side of [-1, 1]) {
          ctx.save();
          ctx.scale(side, 1);
          ctx.beginPath();
          ctx.ellipse(6 * ls, -h * 0.55, 7 * ls, 3.5 * ls, -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      // Brote/flor al final
      if (g > 0.75) {
        const fs = (g - 0.75) / 0.25;
        ctx.fillStyle = '#f0a6c8';
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * 4 * fs, -h + Math.sin(a) * 4 * fs, 3 * fs, 3 * fs, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.arc(0, -h, 2.2 * fs, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    for (const p of popups) {
      if (p.small) {
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.fillStyle = p.pollen
          ? `rgba(255,225,120,${Math.min(1, p.life)})`   // polen: dorado
          : `rgba(160,235,140,${Math.min(1, p.life)})`;  // semilla: verde
      } else {
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = `rgba(255,235,120,${Math.min(1, p.life)})`;
      }
      ctx.fillText(p.txt, p.x, p.y);
    }
  }

  function drawPulses() {
    for (const p of pulses) {
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (p.echo) {
        // Eco de rebote: arco mirando hacia el murciélago (izquierda), tono cálido
        ctx.strokeStyle = 'rgba(255,200,120,0.75)';
        ctx.arc(p.x, p.y, p.r, Math.PI - 0.55, Math.PI + 0.55);
      } else {
        // Onda emitida: arco frontal (derecha), hacia donde "mira"
        ctx.strokeStyle = 'rgba(150,220,255,0.7)';
        ctx.arc(p.x, p.y, p.r, -0.55, 0.55);
      }
      ctx.stroke();
    }
  }

  function drawBat() {
    const { x, y, angle, wing } = bat;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(0.5, 0.5); // murciélago a la mitad de tamaño

    // Cuerpo: sprite con parpadeo y leve impulso al aletear
    const blinking = blinkReady && (state === 'start' || state === 'playing') && frame < blinkUntil;
    const img = blinking ? batBlinkImg : batImg;
    const pop = 1 + wing * 0.08;
    if (batReady) {
      const w = SPRITE_W;
      const h = SPRITE_W * (batImg.height / batImg.width);
      ctx.scale(pop, pop);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
    } else {
      // Respaldo mientras carga la imagen
      ctx.fillStyle = '#4d3a80';
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 17, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawUI() {
    ctx.textAlign = 'center';

    if (state === 'playing' || state === 'dead') {
      ctx.font = 'bold 52px "Courier New", monospace';
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillText(score, W / 2 + 3, 83);
      ctx.fillStyle = '#f5edc8';
      ctx.fillText(score, W / 2, 80);
    }

    if (state === 'start') {
      // Panel principal
      panel(H / 2 - 150, 190);
      ctx.fillStyle = '#f5edc8';
      ctx.font = 'bold 40px "Courier New", monospace';
      ctx.fillText('FLAPPY BAT', W / 2, H / 2 - 90);
      // "Toca para volar" con parpadeo suave: llama la atención del público
      const pulse = 0.65 + 0.35 * Math.abs(Math.sin(frame * 0.05));
      ctx.font = '20px "Courier New", monospace';
      ctx.fillStyle = `rgba(201,184,240,${pulse.toFixed(2)})`;
      ctx.fillText('Toca la pantalla', W / 2, H / 2 - 40);
      ctx.fillText('para volar', W / 2, H / 2 - 14);
      ctx.font = '16px "Courier New", monospace';
      ctx.fillStyle = '#8a7ab0';
      ctx.fillText('Esquiva las estalactitas', W / 2, H / 2 + 20);
      if (best > 0) {
        ctx.fillStyle = '#f5edc8';
        ctx.fillText('Récord: ' + best, W / 2, H / 2 + 48);
      }

      // Dato rotativo (modo atracción), en su propio panel abajo
      if (attractFact) {
        ctx.font = '15px "Courier New", monospace';
        const lines = wrapText(attractFact, W - 120);
        const fh = 34 + lines.length * 20;
        const fy = Math.min(H - 90 - fh, H / 2 + 90);
        panel(fy, fh);
        ctx.fillStyle = '#bfe8ff';
        let ly = fy + 26;
        for (const ln of lines) {
          ctx.fillText(ln, W / 2, ly);
          ly += 20;
        }
      }
    }

    if (state === 'dead') {
      // Ajustar el dato en líneas para calcular la altura del panel
      ctx.font = '16px "Courier New", monospace';
      const factLines = wrapText(currentFact, W - 130);
      const panelH = 227 + factLines.length * 22;
      const top = Math.max(20, H / 2 - panelH / 2);
      panel(top, panelH);

      let cy = top + 46;
      ctx.fillStyle = '#ff6b81';
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('¡GAME OVER!', W / 2, cy);
      cy += 40;

      ctx.fillStyle = '#f5edc8';
      ctx.font = '22px "Courier New", monospace';
      ctx.fillText('Puntos: ' + score + '    Récord: ' + best, W / 2, cy);
      cy += 26;
      ctx.font = '17px "Courier New", monospace';
      ctx.fillStyle = '#a8e6a0';
      ctx.fillText('Alimento capturado: ' + eaten, W / 2, cy);
      cy += 30;

      // Separador
      ctx.strokeStyle = 'rgba(138,111,196,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(80, cy - 6); ctx.lineTo(W - 80, cy - 6);
      ctx.stroke();
      cy += 26;

      // Dato científico
      ctx.fillStyle = '#e8e0ff';
      ctx.font = '16px "Courier New", monospace';
      for (const line of factLines) {
        ctx.fillText(line, W / 2, cy);
        cy += 22;
      }
      cy += 14;

      if (deathFlash <= 0) {
        ctx.font = '17px "Courier New", monospace';
        ctx.fillStyle = '#c9b8f0';
        ctx.fillText('Toca para jugar de nuevo', W / 2, cy);
      }
      if (deathFlash > 20) {
        ctx.fillStyle = `rgba(255,255,255,${(deathFlash - 20) / 5 * 0.5})`;
        ctx.fillRect(0, 0, W, H);
      }
    }
    // ----- Entrada de iniciales (arcade, un solo botón) -----
    if (state === 'entry') {
      panel(H / 2 - 150, 300);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.fillText('¡NUEVO RÉCORD!', W / 2, H / 2 - 108);

      ctx.fillStyle = '#f5edc8';
      ctx.font = '22px "Courier New", monospace';
      ctx.fillText('Puntos: ' + score, W / 2, H / 2 - 74);

      ctx.fillStyle = '#c9b8f0';
      ctx.font = '15px "Courier New", monospace';
      ctx.fillText('Escribe tus iniciales', W / 2, H / 2 - 44);

      // Tres casillas de letras
      const slotW = 54, gap2 = 16;
      const totalW = slotW * 3 + gap2 * 2;
      const x0 = W / 2 - totalW / 2;
      for (let i = 0; i < 3; i++) {
        const sx = x0 + i * (slotW + gap2);
        const sy = H / 2 - 20;
        const active = i === entrySlot;
        ctx.strokeStyle = active ? '#ffd166' : '#5d4590';
        ctx.lineWidth = active ? 3 : 2;
        ctx.beginPath();
        ctx.roundRect(sx, sy, slotW, 62, 8);
        ctx.stroke();
        // letra: fija si ya se eligió, o la que está girando si es la casilla activa
        let ch = i < entrySlot ? entryLetters[i] : (active ? LETTERS[entryIdx] : '');
        ctx.fillStyle = active ? '#ffe9a8' : '#f5edc8';
        ctx.font = 'bold 38px "Courier New", monospace';
        ctx.fillText(ch, sx + slotW / 2, sy + 46);
      }

      ctx.fillStyle = '#a89ccc';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('Toca cuando aparezca tu letra', W / 2, H / 2 + 82);
      ctx.fillText('(o escríbela con el teclado)', W / 2, H / 2 + 102);
    }

    // ----- Tabla de récords -----
    if (state === 'scores') {
      const rows = scoreTable.length;
      const panelH2 = 120 + rows * 30;
      const top = Math.max(30, H / 2 - panelH2 / 2);
      panel(top, panelH2);

      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.fillText('🏆 MEJORES VUELOS', W / 2, top + 44);

      let ry = top + 82;
      ctx.font = '20px "Courier New", monospace';
      for (let i = 0; i < rows; i++) {
        const r = scoreTable[i];
        const isNew = i === lastRankIndex;
        // Resaltar la fila recién ingresada con un parpadeo suave
        if (isNew) {
          const a = 0.25 + 0.2 * Math.abs(Math.sin(frame * 0.12));
          ctx.fillStyle = `rgba(255,209,102,${a.toFixed(2)})`;
          ctx.fillRect(62, ry - 18, W - 124, 26);
        }
        ctx.fillStyle = isNew ? '#fff3cf' : (i === 0 ? '#f5edc8' : '#c9b8f0');
        ctx.textAlign = 'left';
        ctx.fillText((i + 1) + '.', 76, ry);
        ctx.fillText(r.name, 116, ry);
        ctx.textAlign = 'right';
        ctx.fillText(String(r.score), W - 76, ry);
        ctx.textAlign = 'center';
        ry += 30;
      }

      ctx.fillStyle = '#a89ccc';
      ctx.font = '15px "Courier New", monospace';
      ctx.fillText('Toca para jugar de nuevo', W / 2, top + panelH2 - 22);
    }
  }

  // Divide un texto en líneas que caben en maxWidth (usa la fuente activa)
  function wrapText(text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function panel(y, h) {
    ctx.fillStyle = 'rgba(13,8,33,0.75)';
    ctx.strokeStyle = '#5d4590';
    ctx.lineWidth = 3;
    const x = 50, w = W - 100;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 16);
    ctx.fill();
    ctx.stroke();
  }

  // ---------- Bucle ----------
  function loop(now) {
    perfTick(now || performance.now());
    update();
    // Base del frame: escalar por SS para dibujar en coordenadas lógicas (480 de ancho)
    ctx.setTransform(SS, 0, 0, SS, 0, 0);
    drawBackground();
    drawObstacles();
    drawGround();
    drawPlants();
    drawSeeds();
    drawItems();
    drawPulses();
    drawBat();
    drawPopups();
    drawUI();
    requestAnimationFrame(loop);
  }

  fitScreen(); // adaptar a la proporción de la pantalla (TV vertical, F11, etc.)
  reset();
  loop();
})();
</script>
</body>
</html>
